services:
  # ============================================================================
  # 1. Frontend: Render Static Site (React 19 / Vite SPA on global CDN)
  # ============================================================================
  - type: web
    name: zoutty-web
    runtime: static
    buildCommand: npm run build:client
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Immutable cache for Vite hashed production assets (JS bundles, CSS, processed images)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Prevent caching for Service Worker scripts to ensure instant updates
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /registerSW.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

      # Prevent caching of root HTML so users always receive latest bundle references
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

      # Cache heavy demo media (30 days) with revalidation
      - path: /inline_lesson_video.mp4
        name: Cache-Control
        value: public, max-age=2592000, stale-while-revalidate=86400

      # Cache icons and manifest (7 days)
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
      - path: /zouttyLogoHoriz.png
        name: Cache-Control
        value: public, max-age=604800, stale-while-revalidate=86400
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false

  # ============================================================================
  # 2. Backend: Render Web Service (Node/Express API, Gatekeeper, Gemini, Stripe)
  # ============================================================================
  - type: web
    name: zoutty-staging
    runtime: node
    plan: starter
    buildCommand: npm run build:server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PLUS_PRICE_ID
        sync: false
      - key: STRIPE_TOPUP_PRICE_ID
        sync: false
